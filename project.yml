name: NTFSKit

options:
  bundleIdPrefix: com.whereteam
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    ARCHS: arm64                  # libntfs-3g.a is arm64-only for now
    ONLY_ACTIVE_ARCH: "YES"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "U99A3XY2Q2"   # DNA MAKER COMPANY LIMITED
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"

targets:
  NTFSKit:
    type: application
    platform: macOS
    sources:
      - path: App-OSS
      - path: fsbundle/ntfskit.fs
        type: folder
        buildPhase: resources
    info:
      path: App-OSS/Info.plist
      properties:
        CFBundleDisplayName: NTFSKit
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.4"
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whereteam.ntfskit
        PRODUCT_NAME: NTFSKit
        CODE_SIGN_ENTITLEMENTS: App-OSS/App.entitlements
    dependencies:
      - target: NTFSModule
        embed: true

  NTFSModule:
    type: extensionkit-extension
    platform: macOS
    # Floor is macOS 15.4 (Sequoia) — where FSKit first shipped. KOIO + buffer-
    # cache I/O are V1 (15.4). Only requestedMountOptions (26.4) and openUnlink
    deploymentTarget: "15.4"
    sources:
      - path: NTFSModule
        excludes:
          - "bridge/test_bridge.c"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whereteam.ntfskit.NTFSModule
        INFOPLIST_FILE: NTFSModule/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: NTFSModule/Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: NTFSModule/NTFSModule.entitlements
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/refs/ntfs-3g/include
          - $(SRCROOT)/refs/ntfs-3g/include/ntfs-3g
          - $(SRCROOT)/refs/ntfs-3g
          - $(SRCROOT)/NTFSModule/bridge
          - $(SRCROOT)/NTFSModule/bridge/mkntfs
          - $(SRCROOT)/refs/libbde/include
          - $(SRCROOT)/NTFSModule/bridge/bde-shim
        GCC_PREPROCESSOR_DEFINITIONS:
          - HAVE_CONFIG_H=1
        OTHER_LDFLAGS:
          - $(SRCROOT)/refs/ntfs-3g/libntfs-3g/.libs/libntfs-3g.a
          # BitLocker: libbde + its bundled libyal deps (static). All 17 in
          # one -force_load-free list; order doesn't matter for archives.
          - $(SRCROOT)/refs/libbde/libbde/.libs/libbde.a
          - $(SRCROOT)/refs/libbde/libbfio/.libs/libbfio.a
          - $(SRCROOT)/refs/libbde/libcaes/.libs/libcaes.a
          - $(SRCROOT)/refs/libbde/libhmac/.libs/libhmac.a
          - $(SRCROOT)/refs/libbde/libcdata/.libs/libcdata.a
          - $(SRCROOT)/refs/libbde/libcerror/.libs/libcerror.a
          - $(SRCROOT)/refs/libbde/libcfile/.libs/libcfile.a
          - $(SRCROOT)/refs/libbde/libclocale/.libs/libclocale.a
          - $(SRCROOT)/refs/libbde/libcnotify/.libs/libcnotify.a
          - $(SRCROOT)/refs/libbde/libcpath/.libs/libcpath.a
          - $(SRCROOT)/refs/libbde/libcsplit/.libs/libcsplit.a
          - $(SRCROOT)/refs/libbde/libcthreads/.libs/libcthreads.a
          - $(SRCROOT)/refs/libbde/libfcache/.libs/libfcache.a
          - $(SRCROOT)/refs/libbde/libfdatetime/.libs/libfdatetime.a
          - $(SRCROOT)/refs/libbde/libfguid/.libs/libfguid.a
          - $(SRCROOT)/refs/libbde/libfvalue/.libs/libfvalue.a
          - $(SRCROOT)/refs/libbde/libuna/.libs/libuna.a

schemes:
  NTFSKit:
    build:
      targets:
        NTFSKit: all
    run:
      config: Debug
